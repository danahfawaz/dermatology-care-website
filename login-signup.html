<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dermatology Care - Register/Login</title>
    <link rel="stylesheet" href="design.css">
</head>

<body>

<header>
    <h1>Dermatology Care</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="login-signup.html">Register/Login</a>
        <a href="doctors.html">Doctors</a>
        <a href="appointments.html">Book Appointment</a>
        <a href="old-history.php">Appointment History</a>
    </nav>
</header>

<main class="container">
    <h2>Register / Login</h2>
    <p>Please enter your information below.</p>

    <form onsubmit="return validateLogin()">

        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="Enter your phone number">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">

        <button type="submit">Submit</button>

    </form>
</main>

<footer>
    <p>Your skin deserves the best care 💜 </p>
</footer>

<script>
function validateLogin() {

  var name = document.getElementById("fullname").value;
  var email = document.getElementById("email").value;
  var phone = document.getElementById("phone").value;
  var password = document.getElementById("password").value;

  if (name == "" || email == "" || phone == "" || password == "") {
    alert("Please fill all fields");
    return false;
  }

  if (!email.includes("@")) {
    alert("Please enter a valid email");
    return false;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters");
    return false;
  }

  alert("Registered successfully 💜");
  return true;
}
</script>

</body>
</html>
